services:
  - type: web
    name: spendnest-revenue-intelligence
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_NAME
        value: spendnest_revenue_intelligence
      - key: CORS_ORIGINS
        value: "*"
