services:
  - type: web
    name: spendnest-revenue-intelligence
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 22.16.0
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: spendnest_revenue_intelligence
      - key: CORS_ORIGINS
        value: "*"
