version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spendnest_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_NAME=spendnest_revenue_intelligence
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - STORAGE_FILE_PATH=/app/data/spendnest_store.json
      - INITIAL_DATA_PATH=/app/data/01_initial.json
      - UPDATE_DATA_PATH=/app/data/02_update.json
      - EXPORTS_DIR=/app/exports
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped
